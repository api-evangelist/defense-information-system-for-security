description: >-
  No published plans. DISS is a United States Department of Defense enterprise
  system of record operated by the Defense Counterintelligence and Security
  Agency; access is granted through a government account-provisioning process
  to authorized DoD, federal and cleared-contractor security personnel, not
  purchased. There is no developer program, no public API, and therefore no
  plan, tier, quota or price to record.
